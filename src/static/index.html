<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mergington High School Activities</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header>
      <div class="account-control">
        <button
          id="account-button"
          class="account-button"
          type="button"
          aria-label="Account menu"
          aria-expanded="false"
          aria-controls="account-panel"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="12" cy="8" r="3.5"></circle>
            <path d="M4.8 20a7.2 7.2 0 0 1 14.4 0"></path>
          </svg>
        </button>
        <div id="account-panel" class="account-panel hidden">
          <button id="login-button" type="button">Teacher login</button>
          <span id="teacher-status" class="hidden"></span>
          <button id="logout-button" class="secondary-button hidden" type="button">
            Log out
          </button>
        </div>
      </div>
      <h1>Mergington High School</h1>
      <h2>Extracurricular Activities</h2>
    </header>

    <dialog id="login-dialog" aria-labelledby="login-title">
      <form id="login-form">
        <h2 id="login-title">Teacher login</h2>
        <div class="form-group">
          <label for="teacher-username">Username</label>
          <input id="teacher-username" name="username" autocomplete="username" required />
        </div>
        <div class="form-group">
          <label for="teacher-password">Password</label>
          <input
            id="teacher-password"
            name="password"
            type="password"
            autocomplete="current-password"
            required
          />
        </div>
        <p id="login-message" class="error hidden" role="alert"></p>
        <div class="dialog-actions">
          <button type="submit">Sign in</button>
          <button id="cancel-login" class="secondary-button" type="button">Cancel</button>
        </div>
      </form>
    </dialog>

    <main>
      <section id="activities-container">
        <h3>Available Activities</h3>
        <p id="registration-notice" class="registration-notice">
          Teacher sign-in is required to manage registrations.
        </p>
        <div id="activities-list">
          <!-- Activities will be loaded here -->
          <p>Loading activities...</p>
        </div>
      </section>

      <section id="signup-container" hidden>
        <h3>Sign Up for an Activity</h3>
        <form id="signup-form">
          <div class="form-group">
            <label for="email">Student Email:</label>
            <input type="email" id="email" required placeholder="your-email@mergington.edu" />
          </div>
          <div class="form-group">
            <label for="activity">Select Activity:</label>
            <select id="activity" required>
              <option value="">-- Select an activity --</option>
              <!-- Activity options will be loaded here -->
            </select>
          </div>
          <button type="submit">Sign Up</button>
        </form>
        <div id="message" class="hidden"></div>
      </section>
    </main>

    <footer>
      <p>&copy; 2026 Mergington High School</p>
    </footer>

    <script src="app.js"></script>
  </body>
</html>
